<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 50" width="100%" height="50">
  <defs>
    <linearGradient id="lineGrad_header_arsenal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#E5A93C" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080E18" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bgGrad_header_arsenal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E1626" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#0B131E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#080E18" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="48" fill="url(#bgGrad_header_arsenal)" rx="6"/>
  
<g transform="translate(12, 10) scale(0.72)">
  <!-- Crossed bones -->
  <path d="M 4 4 L 36 36 M 36 4 L 4 36" stroke="#C9D1D9" stroke-width="4" stroke-linecap="round"/>
  <circle cx="4" cy="4" r="3" fill="#C9D1D9"/>
  <circle cx="36" cy="4" r="3" fill="#C9D1D9"/>
  <circle cx="4" cy="36" r="3" fill="#C9D1D9"/>
  <circle cx="36" cy="36" r="3" fill="#C9D1D9"/>
  <!-- Skull Head -->
  <circle cx="20" cy="20" r="11" fill="#F0F6FC"/>
  <!-- Jaw -->
  <rect x="16" y="26" width="8" height="6" rx="2" fill="#F0F6FC"/>
  <!-- Teeth cuts -->
  <line x1="18" y1="28" x2="18" y2="32" stroke="#0B131E" stroke-width="1"/>
  <line x1="22" y1="28" x2="22" y2="32" stroke="#0B131E" stroke-width="1"/>
  <!-- Eyes -->
  <circle cx="16" cy="19" r="3" fill="#0B131E"/>
  <circle cx="24" cy="19" r="3" fill="#0B131E"/>
  <!-- Nose -->
  <polygon points="20,22 19,25 21,25" fill="#0B131E"/>
  <!-- Straw Hat Brim -->
  <ellipse cx="20" cy="14" rx="15" ry="3.5" fill="#E5A93C"/>
  <!-- Straw Hat Crown -->
  <path d="M 12 14 C 12 7, 28 7, 28 14 Z" fill="#E5A93C"/>
  <!-- Red Hat Ribbon -->
  <path d="M 12 14 C 15 12, 25 12, 28 14" stroke="#E63946" stroke-width="2.5" fill="none"/>
</g>

  <text x="56" y="32" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Impact, sans-serif" font-size="20" font-weight="900" letter-spacing="2">MY ARSENAL</text>
  <text x="208" y="31" fill="#7D8590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">TOOLS FOR A BIGGER TOMORROW.</text>
  
  <rect x="0" y="47" width="1000" height="2" fill="url(#lineGrad_header_arsenal)"/>
</svg>